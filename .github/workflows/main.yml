# WormHole — signed release APK
#
# Required repository secrets:
#   KEYSTORE_BASE64      base64 of the .jks / .keystore file
#   KEYSTORE_PASSWORD    keystore password
#   KEY_ALIAS            key alias
#   KEY_PASSWORD         key password
#
# Triggers: Run workflow, tags v*, published GitHub Release
#
name: Build APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  release:
    types: [published]

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    name: assembleRelease
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    timeout-minutes: 120

    env:
      RELEASE_STORE_FILE: ${{ github.workspace }}/upload-keystore.jks
      RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.vfs.watch=false
        -Dkotlin.incremental=false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          missing=0
          [ -n "${KEYSTORE_BASE64:-}" ] || { echo "::error::Missing secret KEYSTORE_BASE64"; missing=1; }
          [ -n "${RELEASE_STORE_PASSWORD:-}" ] || { echo "::error::Missing secret KEYSTORE_PASSWORD"; missing=1; }
          [ -n "${RELEASE_KEY_ALIAS:-}" ] || { echo "::error::Missing secret KEY_ALIAS"; missing=1; }
          [ -n "${RELEASE_KEY_PASSWORD:-}" ] || { echo "::error::Missing secret KEY_PASSWORD"; missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "Add the keystore secrets, then re-run."
            exit 1
          fi
      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RELEASE_STORE_FILE"
          test -s "$RELEASE_STORE_FILE"
          echo "Keystore written ($(wc -c < "$RELEASE_STORE_FILE") bytes)"
      - name: Ensure Gradle wrapper
        run: |
          set -euo pipefail
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing — generating wrapper with Gradle 8.11.1"
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          fi
          chmod +x ./gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
      - name: Build signed release APK
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --stacktrace --no-daemon
      - name: Locate APK and mapping
        id: artifacts
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -name "*release*.apk" ! -name "*-unsigned.apk" | head -n 1)
          test -n "$APK" && test -f "$APK"
          MAPPING=$(find app/build/outputs/mapping -name "mapping.txt" | head -n 1)
          VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode\s*=' app/build.gradle.kts | head -1 | sed -E 's/[^0-9]//g')
          OUT_DIR="$GITHUB_WORKSPACE/dist"
          mkdir -p "$OUT_DIR"
          OUT_APK="$OUT_DIR/WormHole-${VERSION_NAME}-${VERSION_CODE}.apk"
          cp "$APK" "$OUT_APK"
          echo "apk=$OUT_APK" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT_APK"
          if [ -n "${MAPPING:-}" ] && [ -f "$MAPPING" ]; then
            cp "$MAPPING" "$OUT_DIR/mapping-${VERSION_NAME}.txt"
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WormHole-apk
          path: |
            dist/*.apk
            dist/mapping-*.txt
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: |
            dist/*.apk
            dist/mapping-*.txt
          fail_on_unmatched_files: false
