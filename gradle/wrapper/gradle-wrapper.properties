#
# NOTE: gradle-wrapper.jar is intentionally NOT committed by me here --
# I have no network access in this environment to fetch the real binary,
# and committing a fake/placeholder jar would silently break every build
# with a confusing "invalid jar" error instead of a clear one. The CI
# workflow (.github/workflows/build.yml) generates a genuine wrapper jar
# on the runner via `gradle wrapper` before every build, which is more
# reliable than a static binary anyway. If you also want to run this
# locally in Termux, run the same two lines from ci_bootstrap in the
# workflow file, or `pkg install gradle` and run `gradle wrapper` once.
#
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
